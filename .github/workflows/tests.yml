name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[ui,dev]"
      - run: ruff check app src tests scripts
      - run: python scripts/check_secrets.py
      - run: python -m compileall -q src app tests scripts
      - run: python scripts/setup_demo_db.py
      - run: queryguard-verify
      - run: pytest
