[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "queryguard-ai"
version = "1.1.0"
description = "Governed Text-to-SQL analytics copilot with schema retrieval, AST validation, read-only execution, evaluation, and observability."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Portfolio Project Author"}]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "httpx>=0.27,<1.0",
  "sqlglot>=30.13,<31.0",
  "numpy>=1.26,<3.0",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40,<2.0", "pandas>=2.2,<3.0"]
semantic = ["sentence-transformers>=3.2,<6.0"]
dev = [
  "pytest>=8.3,<10.0",
  "pytest-cov>=5.0,<8.0",
  "ruff>=0.8,<1.0",
]
all = [
  "streamlit>=1.40,<2.0",
  "pandas>=2.2,<3.0",
  "sentence-transformers>=3.2,<6.0",
  "pytest>=8.3,<10.0",
  "pytest-cov>=5.0,<8.0",
  "ruff>=0.8,<1.0",
]

[project.scripts]
queryguard-api = "queryguard.api.main:run"
queryguard-eval = "queryguard.evaluation.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
