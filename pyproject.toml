[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "queryguard-ai"
version = "2.0.0"
description = "Governed data and document intelligence platform for Text-to-SQL, cited document Q&A, and invoice analytics."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Vaibhav"}]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "httpx>=0.27,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "sqlglot>=30.13,<31.0",
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<3.0",
  "openpyxl>=3.1,<4.0",
  "defusedxml>=0.7,<1.0",
  "python-docx>=1.1,<2.0",
  "python-pptx>=1.0,<2.0",
  "PyMuPDF>=1.24,<2.0",
  "Pillow>=10.0,<13.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40,<2.0"]
semantic = ["sentence-transformers>=3.2,<6.0"]
ocr = ["pytesseract>=0.3.13,<1.0"]
dev = [
  "pytest>=8.3,<10.0",
  "pytest-cov>=5.0,<8.0",
  "ruff>=0.8,<1.0",
]
all = [
  "streamlit>=1.40,<2.0",
  "sentence-transformers>=3.2,<6.0",
  "pytesseract>=0.3.13,<1.0",
  "pytest>=8.3,<10.0",
  "pytest-cov>=5.0,<8.0",
  "ruff>=0.8,<1.0",
]

[project.scripts]
queryguard-api = "queryguard.api.main:run"
queryguard-eval = "queryguard.evaluation.runner:main"
queryguard-verify = "queryguard.verification:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
