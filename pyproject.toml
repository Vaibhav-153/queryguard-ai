[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "queryguard-ai"
version = "2.1.0"
description = "Governed Text-to-SQL, document question answering, and invoice analytics for local data."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Vaibhav"}]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "httpx>=0.27,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "sqlglot>=30.13,<31.0",
  "pandas>=2.2,<3.0",
  "openpyxl>=3.1,<4.0",
  "python-docx>=1.1,<2.0",
  "python-pptx>=1.0,<2.0",
  "PyMuPDF>=1.24,<2.0",
  "Pillow>=10.0,<13.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40,<2.0"]
ocr = ["pytesseract>=0.3.13,<1.0"]
dev = [
  "pytest>=8.3,<10.0",
  "pytest-cov>=5.0,<8.0",
  "ruff>=0.8,<1.0",
]

[project.scripts]
queryguard-api = "queryguard.api:run"
queryguard-verify = "queryguard.verify:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]
